name: README Raid

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Game issue number to retry
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: readme-raid
  cancel-in-progress: false
  queue: max

jobs:
  play:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'raid|') && github.event.issue.user.type == 'User')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Process one shared turn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node game/github.mjs
